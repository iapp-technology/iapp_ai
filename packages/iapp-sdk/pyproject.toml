[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iapp-ai"
version = "1.3.0"
description = "Python SDK for the iApp AI Marketplace APIs (https://iapp.co.th) — Thai OCR, eKYC, NLP, speech and more"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
    { name = "Kobkrit Viriyayudhakorn", email = "kobkrit@iapp.co.th" },
    { name = "iApp Technology Co., Ltd.", email = "dev@iapp.co.th" },
]
keywords = ["iapp", "thai", "ai", "ocr", "ekyc", "nlp", "speech", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "iapp-core>=0.1.0,<0.2.0",
    "requests>=2.20.0",
]

[project.urls]
Homepage = "https://iapp.co.th"
Documentation = "https://iapp.co.th/docs/intro"
Repository = "https://github.com/iapp-technology/iapp_ai"

[tool.uv.sources]
iapp-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/iapp_ai"]
