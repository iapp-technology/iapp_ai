# iApp AI monorepo — uv workspace root.
#
# This repo hosts three packages that share one core:
#   packages/iapp-core  -> iapp-core  : shared transport/auth/errors/formatting
#   packages/iapp-sdk   -> iapp-ai    : synchronous Python SDK (backward compatible)
#   packages/iapp-mcp   -> iapp-mcp   : iApp AI Marketplace MCP server
#
# Each package has its own pyproject.toml and is published independently.

[tool.uv.workspace]
members = ["packages/iapp-core", "packages/iapp-sdk", "packages/iapp-mcp", "packages/iapp-nlp"]

# Dev tooling for the CI pipeline (A-5). Installed by `uv sync`.
[dependency-groups]
dev = [
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<3.0",
    "pytest>=8,<10",
]

# Ruff stays on its default rule set (E4/E7/E9/F) so the existing code passes;
# the team can opt into E501/import-sorting once domain files are reformatted.
[tool.ruff]
line-length = 100
target-version = "py310"

# Third-party libs (httpx, mcp, pydantic, requests) ship without stubs here.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"

ignore_missing_imports = true

# The OpenThai2.0-LATTE-WordSeg-Lite runtime, kept as its authors wrote it: it allows for models
# with one unit, where the unit is None, in ways that strict Optional checking rejects.
[[tool.mypy.overrides]]
module = "iapp_nlp.tokenizer.latte"
strict_optional = false
disable_error_code = ["var-annotated"]

# onnxruntime (needed by iapp-nlp) 1.24 and later declare Python >= 3.10 but ship no wheels for
# 3.10, and uv does not skip them the way pip does, so lock the last release with 3.10 wheels.
[tool.uv]
constraint-dependencies = ["onnxruntime<1.24; python_full_version < '3.11'"]
